services:
  devui:
    image: cybersec-agent-devui
    container_name: cybersec-agent-devui
    working_dir: /app
    volumes:
      - .:/app
      - /app/.venv  # החציצה הקריטית: שומרת על סביבת הלינוקס של הקונטיינר
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      API_BASE_URL: "https://api.groq.com/openai/v1"
      MODEL: "llama-3.3-70b-versatile"
      ENABLE_OTEL: "true"
      ENABLE_SENSITIVE_DATA: "true"
    command: ["uv", "run", "devui", ".", "--host", "0.0.0.0", "--port", "8080"]